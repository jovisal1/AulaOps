---
- name: Copiar carpetas al escritorio
  hosts: aula
  become: true
  gather_facts: true
  serial: 10
  tags:
  - folders
  vars_files:
  - vars/global.yml
  pre_tasks:
  - name: Comprobaciones previas
    ansible.builtin.import_tasks: tasks/preflight.yml
    tags:
    - always
  tasks:
  - name: Resolver cuenta del aula
    ansible.builtin.import_tasks: tasks/account.yml
  - name: Comprobar que hay contenido para copiar antes de limpiar
    ansible.builtin.assert:
      that:
      - aula_files | default([]) | length > 0 or aula_folders | default([]) | length
        > 0
      fail_msg: Selecciona archivos o carpetas de origen. No se ha limpiado el escritorio.
  - name: Copiar carpetas al escritorio del usuario
    block:
    - name: Instalar utilidad de carpetas de escritorio
      ansible.builtin.apt:
        name:
        - xdg-user-dirs
        - acl
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Comprobar si el usuario ya tiene escritorio configurado
      ansible.builtin.stat:
        path: '{{ aula_home }}/.config/user-dirs.dirs'
      register: xdg_config
    - name: Consultar escritorio localizado del usuario
      become_user: '{{ aula_user }}'
      ansible.builtin.command:
        argv:
        - xdg-user-dir
        - DESKTOP
      environment:
        HOME: '{{ aula_home }}'
      register: desktop_query
      changed_when: false
      when: xdg_config.stat.exists
    - name: Elegir escritorio existente o Escritorio para una cuenta nueva
      ansible.builtin.set_fact:
        aula_desktop: '{{ desktop_query.stdout if xdg_config.stat.exists else aula_home
          + ''/Escritorio'' }}'
    - name: Validar que el escritorio esté dentro del home
      ansible.builtin.assert:
        that:
        - aula_desktop.startswith(aula_home + '/')
        - '''..'' not in aula_desktop.split(''/'')'
        fail_msg: Escritorio deshabilitado o fuera del home; revisa user-dirs.dirs.
    - name: Validar ruta real antes de preparar el escritorio
      ansible.builtin.import_tasks: tasks/validate_desktop_path.yml
    - name: Crear escritorio
      ansible.builtin.file:
        path: '{{ aula_desktop }}'
        state: directory
        owner: '{{ aula_user }}'
        group: '{{ aula_gid }}'
        mode: '0755'
    - name: Crear configuración XDG para una cuenta nueva
      ansible.builtin.file:
        path: '{{ aula_home }}/.config'
        state: directory
        owner: '{{ aula_user }}'
        group: '{{ aula_gid }}'
        mode: '0755'
      when: not xdg_config.stat.exists
    - name: Registrar escritorio para una cuenta nueva
      ansible.builtin.copy:
        content: XDG_DESKTOP_DIR="$HOME/Escritorio"
        dest: '{{ aula_home }}/.config/user-dirs.dirs'
        owner: '{{ aula_user }}'
        group: '{{ aula_gid }}'
        mode: '0644'
        force: false
      when: not xdg_config.stat.exists
    - name: Limpiar carpetas del escritorio antes de copiar material nuevo
      ansible.builtin.import_tasks: tasks/clear_desktop_folders.yml
    - name: Copiar cada carpeta conservando su nombre
      ansible.builtin.copy:
        src: '{{ item }}'
        dest: '{{ aula_desktop }}/'
        owner: '{{ aula_user }}'
        group: '{{ aula_gid }}'
        mode: preserve
        directory_mode: '0755'
        backup: true
      loop: '{{ aula_folders }}'
    - name: Crear carpeta elegida para los archivos seleccionados
      ansible.builtin.file:
        path: '{{ aula_desktop }}/{{ aula_destination_folder }}'
        state: directory
        owner: '{{ aula_user }}'
        group: '{{ aula_gid }}'
        mode: '0755'
      when: aula_files | default([]) | length > 0
    - name: Copiar archivos seleccionados a la carpeta del escritorio
      ansible.builtin.copy:
        src: '{{ item }}'
        dest: '{{ aula_desktop }}/{{ aula_destination_folder }}/'
        owner: '{{ aula_user }}'
        group: '{{ aula_gid }}'
        mode: '0644'
        backup: true
      loop: '{{ aula_files | default([]) }}'
