---
- name: Obtener la cuenta de destino
  ansible.builtin.getent:
    database: passwd
    key: '{{ aula_user }}'
    fail_key: false
- name: Comprobar que existe el usuario del aula
  ansible.builtin.assert:
    that:
    - ansible_facts.getent_passwd.get(aula_user) is not none
    fail_msg: >-
      El usuario del aula '{{ aula_user }}' no existe en {{ inventory_hostname }}.
      Selecciona también 'Crear usuario del aula' e indica su contraseña,
      o utiliza una cuenta existente. El nombre distingue mayúsculas y minúsculas.
- name: Resolver home y grupo primario de destino
  ansible.builtin.set_fact:
    aula_home: '{{ ansible_facts.getent_passwd[aula_user][4] }}'
    aula_gid: '{{ ansible_facts.getent_passwd[aula_user][2] }}'
- name: Comprobar home seguro
  ansible.builtin.assert:
    that:
    - aula_user != 'root'
    - aula_home.startswith('/home/')
    - aula_home != '/home/'
    fail_msg: Se requiere una cuenta local con home bajo /home.
