---
- name: Probar conexión y sudo
  hosts: aula
  become: true
  gather_facts: true
  serial: 10
  tags:
  - check
  vars_files:
  - vars/global.yml
  pre_tasks:
  - name: Comprobaciones previas
    ansible.builtin.import_tasks: tasks/preflight.yml
    tags:
    - always
  tasks:
  - name: Verificar conexión y sudo sin modificar el sistema
    ansible.builtin.ping: null
